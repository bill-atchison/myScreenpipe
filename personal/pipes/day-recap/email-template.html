<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standup Update — {{standup_date}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f5;color:#24292f;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background-color:#f3f4f5;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:720px;border-collapse:collapse;background-color:#ffffff;border:1px solid #d8dee4;text-align:left;">
          <tr>
            <td style="padding:28px 28px 22px 28px;border-bottom:1px solid #d8dee4;">
              <h1 style="margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:700;line-height:1.25;color:#24292f;">Standup Update</h1>
              <p style="margin:0 0 6px 0;font-size:16px;line-height:1.5;"><strong>Standup Date:</strong> {{standup_date}}</p>
              <p style="margin:0 0 6px 0;font-size:14px;line-height:1.5;color:#57606a;">Curated Today — {{curated_at}}</p>
              <p style="margin:0;font-size:14px;line-height:1.5;color:#57606a;">Type: Standup Update</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px 14px 28px;">
              <h2 style="margin:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.35;color:#24292f;">TL;DR</h2>
              <ul style="margin:0;padding-left:24px;list-style-type:disc;font-size:16px;line-height:1.6;">{{tldr_items}}</ul>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 28px 14px 28px;border-top:1px solid #e6e8eb;">
              <h2 style="margin:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.35;color:#24292f;">Yesterday</h2>
              <ul style="margin:0;padding-left:24px;list-style-type:disc;font-size:16px;line-height:1.6;">{{yesterday_items}}</ul>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 28px 24px 28px;border-top:1px solid #e6e8eb;">
              <h2 style="margin:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;line-height:1.35;color:#24292f;">Today</h2>
              <ul style="margin:0;padding-left:24px;list-style-type:disc;font-size:16px;line-height:1.6;">{{today_items}}</ul>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
